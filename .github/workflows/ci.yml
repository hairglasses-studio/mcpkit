# DEPRECATED: Manual diagnostics only. Authoritative gates run locally with
# `GOWORK=off make ci` and `GOWORK=off make check-dual`.
#
# CI — calls the org-wide reusable Go test workflow.
#
# Replaces inline test steps with:
#   hairglasses-studio/.github/.github/workflows/go-test.yml@main

name: CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: hairglasses-studio/.github/.github/workflows/go-test.yml@main
    with:
      lane: ${{ github.event_name == 'pull_request' && 'fast' || 'standard' }}
      go-version: "1.26.1"
      test-flags: "-count=1 -race"
      coverage-threshold: 0
      timeout: "30m"

  official-sdk:
    name: Official SDK build tag
    runs-on:
      group: Internal-Arch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true
      - run: make build-official test-official

  benchmark-regression:
    name: Benchmark regression guard
    runs-on:
      group: Internal-Arch
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache: true
          cache-dependency-path: head/go.sum

      - name: Benchmark base
        working-directory: base
        run: |
          set -euo pipefail
          go test -bench=. -benchmem -run '^$' ./mcptest ./testing/benchmark | tee ../bench-base.txt

      - name: Benchmark head
        working-directory: head
        run: |
          set -euo pipefail
          go test -bench=. -benchmem -run '^$' ./mcptest ./testing/benchmark | tee ../bench-head.txt

      - name: Compare benchmark thresholds
        working-directory: head
        run: |
          go run ./tools/benchguard \
            -baseline ../bench-base.txt \
            -current ../bench-head.txt \
            -latency-threshold 15 \
            -memory-threshold 20 \
            -alloc-threshold 10 \
            -min-overlap 10
