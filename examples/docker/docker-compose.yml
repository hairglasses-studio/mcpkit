# Two containerized MCP StreamableHTTP servers behind nginx.
#
# Usage:
#   docker compose up --build
#   curl http://localhost:8080/health
#   curl http://localhost:8080/identity

services:
  mcp-primary:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    environment:
      PORT: "8080"
      SERVER_ID: mcp-primary
      PUBLIC_BASE_URL: http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mcp-secondary:
    build:
      context: ../..
      dockerfile: examples/docker/Dockerfile
    environment:
      PORT: "8080"
      SERVER_ID: mcp-secondary
      PUBLIC_BASE_URL: http://localhost:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mcp-primary:
        condition: service_healthy
      mcp-secondary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
